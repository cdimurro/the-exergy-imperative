name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check out canonical Quantity and Quality contract
        uses: actions/checkout@v7
        with:
          repository: cdimurro/quantity-and-quality
          path: canonical
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,data,mcp]"
      - name: Reject cross-repository contract drift
        shell: bash
        run: |
          python -m pip install ./canonical
          python -m quantity_quality export-web-data \
            --output "$RUNNER_TEMP/reference_examples.json" \
            --contract-output "$RUNNER_TEMP/conformance_contract_v1.json"
          cmp src/exergy_imperative/data/conformance_contract_v1.json \
            "$RUNNER_TEMP/conformance_contract_v1.json"
      - run: python -m ruff check src tests examples scripts
      - run: python -m ruff format --check src tests examples scripts
      - run: python -m pytest --cov=exergy_imperative --cov-report=term-missing

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,data]"
      - run: python -m pytest
      - run: python examples/quickstart.py
      - run: python examples/engineering_workflows.py
      - run: python examples/agent_workflow.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Test wheel in a clean environment
        shell: bash
        run: |
          python -m venv /tmp/exergy-wheel-test
          /tmp/exergy-wheel-test/bin/python -m pip install dist/*.whl
          /tmp/exergy-wheel-test/bin/python -c "import exergy_imperative as xi; assert xi.run_bundled_validation_suite().passed"
          /tmp/exergy-wheel-test/bin/exergy validate
